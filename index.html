<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>scr-saver · System Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400&family=Outfit:wght@200;300;400;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <main class="screen-grid" aria-label="Clock, reflection and system dashboard">
    <section class="panel clock-panel" aria-label="Local clock">
      <header class="panel-heading"><span>LOCAL TIME</span><span>SEOUL</span></header>
      <div class="panel-content clock-content"><div class="clock-display" id="clockContainer">
        <div class="date-row"><span id="dateText"></span><span class="day-badge" id="dayBadge"></span></div>
        <div class="time-row">
          <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span>
          <div class="seconds-wrap"><span id="seconds">00</span><span class="ampm" id="ampm">AM</span></div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
      </div></div>
    </section>

    <section class="panel quote-panel" aria-label="English reflection">
      <div class="quote-content"><blockquote class="quote" id="quoteText" lang="en" aria-live="polite"></blockquote></div>
    </section>

    <section class="panel monitor-panel" aria-label="System resource dashboard">
      <header class="panel-heading"><span>SYSTEM MONITOR</span><div class="monitor-tools"><span id="liveLabel">CONNECTING</span><button class="maintenance-toggle" id="maintenanceOpen" type="button">캐시 관리</button></div></header>
      <div class="panel-content resource-list">
        <div class="resource-card resource-cpu" data-level="offline">
          <div class="resource-heading"><span class="resource-label"><svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></svg><span>CPU</span></span><span class="resource-level" id="cpuLevel">CONNECTING</span></div>
          <div class="resource-body">
          <div class="resource-track"><div class="resource-fill" id="cpuBar"></div></div>
          <div class="resource-readout">
            <div class="resource-primary"><span class="resource-value" id="cpuValue">—</span></div>
            <div class="resource-secondary"><span class="resource-detail" id="cpuDetail">Processor usage</span></div>
          </div>
          </div>
        </div>
        <div class="resource-card resource-ram" data-level="offline">
          <div class="resource-heading"><span class="resource-label"><svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="12" rx="2"/><path d="M5 17v3m4-3v3m6-3v3m4-3v3"/><rect x="5" y="8" width="5" height="6" rx="1"/><rect x="14" y="8" width="5" height="6" rx="1"/></svg><span>RAM</span></span><span class="resource-level" id="ramLevel">CONNECTING</span></div>
          <div class="resource-body">
          <div class="resource-track"><div class="resource-fill" id="ramBar"></div></div>
          <div class="resource-readout">
            <div class="resource-primary"><span class="resource-value" id="ramValue">—</span></div>
            <div class="resource-secondary"><div class="resource-detail" id="ramDetail">
              <div class="capacity-row capacity-used"><span class="capacity-label">사용</span><span class="capacity-amount" id="ramUsed">—</span></div>
              <div class="capacity-row capacity-remaining"><span class="capacity-label">잔여</span><span class="capacity-amount" id="ramRemaining">—</span></div>
              <span class="capacity-unavailable">드라이브 연결 안 됨</span>
            </div></div>
          </div>
          </div>
        </div>
        <div class="resource-card resource-disk" data-level="offline">
          <div class="resource-heading"><span class="resource-label"><svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><rect x="8" y="7" width="8" height="7" rx="1"/><path d="M9 18h6M8 3v2m8-2v2"/></svg><span>SSD</span></span><span class="resource-level" id="diskLevel">CONNECTING</span></div>
          <div class="resource-body">
          <div class="resource-track"><div class="resource-fill" id="diskBar"></div></div>
          <div class="resource-readout">
            <div class="resource-primary"><span class="resource-value" id="diskValue">—</span></div>
            <div class="resource-secondary"><div class="resource-detail" id="diskDetail">
              <div class="capacity-row capacity-used"><span class="capacity-label">사용</span><span class="capacity-amount" id="diskUsed">—</span></div>
              <div class="capacity-row capacity-remaining"><span class="capacity-label">잔여</span><span class="capacity-amount" id="diskRemaining">—</span></div>
              <span class="capacity-unavailable">드라이브 연결 안 됨</span>
            </div></div>
          </div>
          </div>
        </div>
        <div class="resource-card resource-hdd" data-level="offline">
          <div class="resource-heading"><span class="resource-label"><svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="11" r="1"/><path d="m17 7-5 7m-4 4h8"/></svg><span>HDD · 1 TB</span></span><span class="resource-level" id="hddLevel">CONNECTING</span></div>
          <div class="resource-body">
          <div class="resource-track"><div class="resource-fill" id="hddBar"></div></div>
          <div class="resource-readout">
            <div class="resource-primary"><span class="resource-value" id="hddValue">—</span></div>
            <div class="resource-secondary"><div class="resource-detail" id="hddDetail">
              <div class="capacity-row capacity-used"><span class="capacity-label">사용</span><span class="capacity-amount" id="hddUsed">—</span></div>
              <div class="capacity-row capacity-remaining"><span class="capacity-label">잔여</span><span class="capacity-amount" id="hddRemaining">—</span></div>
              <span class="capacity-unavailable">드라이브 연결 안 됨</span>
            </div></div>
          </div>
          </div>
        </div>
      </div>
      <div class="resource-status" id="resourceStatus" aria-live="polite"></div>
    </section>

  </main>
  <dialog class="maintenance-dialog" id="maintenanceDialog" aria-labelledby="maintenanceTitle">
    <header class="maintenance-heading"><div><p class="maintenance-eyebrow">MANUAL MAINTENANCE</p><h2 id="maintenanceTitle">캐시 관리</h2></div><button class="maintenance-close" id="maintenanceClose" type="button" aria-label="닫기">×</button></header>
    <div class="maintenance-tabs" aria-label="정리 대상">
      <button type="button" data-cache-target="ram" aria-pressed="false">RAM</button>
      <button type="button" data-cache-target="ssd" aria-pressed="true">SSD</button>
      <button type="button" data-cache-target="hdd" aria-pressed="false">HDD</button>
    </div>
    <p class="maintenance-description" id="maintenanceDescription"></p>
    <label class="maintenance-field" id="maintenancePathField" hidden>HDD 캐시 폴더<input id="maintenancePath" type="text" placeholder="예: /mnt/data/.cache/thumbnails" autocomplete="off" spellcheck="false"></label>
    <label class="maintenance-field" id="maintenanceAgeField">정리할 파일<select id="maintenanceAge"><option value="7">7일 이상 지난 캐시</option><option value="30">30일 이상 지난 캐시</option><option value="0">전체 캐시 파일</option></select></label>
    <button class="maintenance-preview" id="maintenancePreview" type="button">정리 대상 확인</button>
    <section class="maintenance-summary" id="maintenanceSummary" hidden>
      <div class="maintenance-estimate" id="maintenanceEstimate"></div><ul class="maintenance-paths" id="maintenancePaths"></ul>
      <label class="maintenance-confirm"><input id="maintenanceConfirm" type="checkbox">표시된 대상의 정리를 확인했습니다</label>
      <button class="maintenance-execute" id="maintenanceExecute" type="button" disabled>확인 후 정리</button>
    </section>
    <p class="maintenance-status" id="maintenanceStatus" role="status"></p>
    <p class="maintenance-hint">ESC로 창 닫기 · 정리는 이 창에서 직접 실행합니다</p>
  </dialog>
  <div class="guide-hint">키보드를 누르면 종료됩니다</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
